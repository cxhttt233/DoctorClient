name: Hop Web VFS session fix

on:
  push:
    branches: [hop-web-vfs-session-fix-20260902]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vfs-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Apache Hop 20260901 pre-08:10Z baseline
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 41af57cf9d7ae13bf24df069cbea251013068a2a
          test "$(git rev-parse HEAD)" = "41af57cf9d7ae13bf24df069cbea251013068a2a"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hop/pom.xml

      - name: Prove target VFS lineage
        run: |
          cd hop
          git log --format='%H %cI %s' -- core/src/main/java/org/apache/hop/core/vfs/HopVfs.java | head -8 | tee ../vfs-lineage.log
          grep -q 'HopVfsNamespaces.setScope(new RapSessionScope' rap/src/main/java/org/apache/hop/ui/hopgui/HopWeb.java
          grep -q 'HopVfs.setBootstrapVariables(variables)' plugins/misc/projects/src/main/java/org/apache/hop/projects/util/ProjectsUtil.java
          grep -q 'HopVfsNamespaces.reset();' core/src/main/java/org/apache/hop/core/vfs/HopVfs.java

      - name: Baseline state-machine proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hop/core/src/main/java/org/apache/hop/core/vfs/HopVfs.java').read_text()
          n=Path('hop/core/src/main/java/org/apache/hop/core/vfs/HopVfsNamespaces.java').read_text()
          assert 'if (namedProvidersRegistered) {\n      reset();' in p
          assert 'isolateEverything = newScope != null;' in n
          assert 'NAMESPACES.values().forEach(HopVfsNamespace::close);' in n
          assert 'scope.remove();' in n
          print('Baseline contains the global reset path that can close all Hop Web namespaces.')
          PY

      - name: Apply candidate fix and tests
        run: python3 vfs-fix/apply_vfs_fix.py hop

      - name: Verify patch scope
        run: |
          cd hop
          git diff -- core/src/main/java/org/apache/hop/core/vfs/HopVfs.java core/src/main/java/org/apache/hop/core/vfs/HopVfsNamespaces.java core/src/test/java/org/apache/hop/core/vfs/HopVfsMultiTenantBootstrapTest.java | tee ../candidate.diff
          changed=$(git diff --name-only | sort)
          echo "$changed"
          test "$(echo "$changed" | grep -v '^core/src/main/java/org/apache/hop/core/vfs/HopVfs.java$' | grep -v '^core/src/main/java/org/apache/hop/core/vfs/HopVfsNamespaces.java$' | grep -v '^core/src/test/java/org/apache/hop/core/vfs/HopVfsMultiTenantBootstrapTest.java$' | wc -l)" -eq 0
          grep -q 'if (variables != null && HopVfsNamespaces.isIsolateEverything())' core/src/main/java/org/apache/hop/core/vfs/HopVfs.java

      - name: Run focused core VFS regression tests
        working-directory: hop
        run: |
          set -o pipefail
          ./mvnw -B -pl core -DskipITs -Dtest=HopVfsMultiTenantBootstrapTest,HopVfsNamespaceScopingTest,HopVfsSingleManagerTest,HopVfsTest test 2>&1 | tee ../core-vfs-tests.log

      - name: Compile affected modules
        working-directory: hop
        run: |
          set -o pipefail
          ./mvnw -B -pl core,ui,rap,engine,plugins/misc/projects -am -DskipTests install 2>&1 | tee ../affected-build.log

      - name: Static cross-check production call sites
        run: |
          cd hop
          # Count actual external production invocations, not the HopVfs declaration/Javadoc.
          git grep -n 'HopVfs\.setBootstrapVariables(' -- ':!**/src/test/**' | tee ../bootstrap-call-sites.log
          count=$(git grep -n 'HopVfs\.setBootstrapVariables(' -- ':!**/src/test/**' | wc -l)
          test "$count" -eq 1
          grep -q 'ProjectsUtil.java:.*HopVfs.setBootstrapVariables(variables)' ../bootstrap-call-sites.log
          git grep -n 'HopVfs.reset()' -- ':!**/src/test/**' | tee ../vfs-reset-call-sites.log || true
          git grep -n 'HopVfs.refresh(' -- ':!**/src/test/**' | tee ../vfs-refresh-call-sites.log || true

      - name: Build and dual-session smoke-test Hop Web
        working-directory: hop
        run: |
          set -Eeuo pipefail
          printf '\n!lib-p2/\n!lib-p2/**\n' >> .dockerignore
          docker build --progress=plain \
            -f docker/unified.Dockerfile \
            --target web \
            --build-arg HOP_BUILD_FROM_SOURCE=local \
            --build-arg BUILDER_TYPE=full \
            --build-arg SKIP_FAT_JAR=true \
            -t hop-web-vfs-fix-smoke . 2>&1 | tee ../docker-build.log

          docker run -d --name hop-web-vfs-fix-smoke -p 18080:8080 \
            -e HOP_LOG_LEVEL=Basic \
            hop-web-vfs-fix-smoke

          cleanup() {
            docker logs hop-web-vfs-fix-smoke > ../hop-web-smoke.log 2>&1 || true
            docker rm -f hop-web-vfs-fix-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 120); do
            if curl -fsSL --max-time 10 http://127.0.0.1:18080/ui -o /tmp/hop-ready.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          rm -f ../session-a.cookies ../session-b.cookies
          curl -fsSL --max-time 30 -c ../session-a.cookies -b ../session-a.cookies http://127.0.0.1:18080/ui -o ../session-a.html
          sleep 2
          curl -fsSL --max-time 30 -c ../session-b.cookies -b ../session-b.cookies http://127.0.0.1:18080/ui -o ../session-b.html

          sid_a=$(awk '$6 == "JSESSIONID" {print $7}' ../session-a.cookies | tail -1)
          sid_b=$(awk '$6 == "JSESSIONID" {print $7}' ../session-b.cookies | tail -1)
          echo "Session A JSESSIONID: ${sid_a:-missing}"
          echo "Session B JSESSIONID: ${sid_b:-missing}"
          test -n "$sid_a"
          test -n "$sid_b"
          test "$sid_a" != "$sid_b"

          # Alternate requests after both sessions exist. This specifically exercises A again after B
          # has initialized, the sequence that used to leave A holding a closed VFS manager.
          for i in $(seq 1 10); do
            curl -fsSL --max-time 30 -b ../session-a.cookies http://127.0.0.1:18080/ui -o /tmp/a-${i}.html
            curl -fsSL --max-time 30 -b ../session-b.cookies http://127.0.0.1:18080/ui -o /tmp/b-${i}.html
          done
          sleep 5

          docker logs hop-web-vfs-fix-smoke > ../hop-web-smoke.log 2>&1
          if grep -Eiq 'no base URI|No files-cache implementation set|Invalid thread access|InvalidThreadAccess|Widget is disposed|NoSuchMethodError|NoClassDefFoundError|LinkageError' ../hop-web-smoke.log; then
            echo 'Forbidden VFS/session/linkage error detected:' >&2
            grep -Ein 'no base URI|No files-cache implementation set|Invalid thread access|InvalidThreadAccess|Widget is disposed|NoSuchMethodError|NoClassDefFoundError|LinkageError' ../hop-web-smoke.log | tail -100 >&2 || true
            exit 1
          fi
          echo 'Two distinct Hop Web sessions remained error-free after alternating requests.'

      - name: Collect hotfix jar
        run: |
          mkdir -p artifacts
          cp hop/core/target/hop-core-2.20.0-SNAPSHOT.jar artifacts/
          sha256sum artifacts/*.jar > artifacts/SHA256SUMS.txt

      - name: Upload diagnostics and candidate jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfs-session-fix-round2
          path: |
            vfs-lineage.log
            candidate.diff
            core-vfs-tests.log
            affected-build.log
            bootstrap-call-sites.log
            vfs-reset-call-sites.log
            vfs-refresh-call-sites.log
            docker-build.log
            hop-web-smoke.log
            session-a.cookies
            session-b.cookies
            session-a.html
            session-b.html
            artifacts/*
          if-no-files-found: warn
