name: Hop Web VFS session fix

on:
  push:
    branches: [hop-web-vfs-session-fix-20260902]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vfs-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Apache Hop 20260901 pre-08:10Z baseline
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 41af57cf9d7ae13bf24df069cbea251013068a2a
          test "$(git rev-parse HEAD)" = "41af57cf9d7ae13bf24df069cbea251013068a2a"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hop/pom.xml

      - name: Prove target VFS lineage
        run: |
          cd hop
          git log --format='%H %cI %s' -- core/src/main/java/org/apache/hop/core/vfs/HopVfs.java | head -8 | tee ../vfs-lineage.log
          grep -q 'HopVfsNamespaces.setScope(new RapSessionScope' rap/src/main/java/org/apache/hop/ui/hopgui/HopWeb.java
          grep -q 'HopVfs.setBootstrapVariables(variables)' plugins/misc/projects/src/main/java/org/apache/hop/projects/util/ProjectsUtil.java
          grep -q 'HopVfsNamespaces.reset();' core/src/main/java/org/apache/hop/core/vfs/HopVfs.java

      - name: Baseline state-machine proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hop/core/src/main/java/org/apache/hop/core/vfs/HopVfs.java').read_text()
          n=Path('hop/core/src/main/java/org/apache/hop/core/vfs/HopVfsNamespaces.java').read_text()
          assert 'if (namedProvidersRegistered) {\n      reset();' in p
          assert 'isolateEverything = newScope != null;' in n
          assert 'NAMESPACES.values().forEach(HopVfsNamespace::close);' in n
          assert 'scope.remove();' in n
          print('Baseline contains the global reset path that can close all Hop Web namespaces.')
          PY

      - name: Apply candidate fix and tests
        run: python3 vfs-fix/apply_vfs_fix.py hop

      - name: Verify patch scope
        run: |
          cd hop
          git diff -- core/src/main/java/org/apache/hop/core/vfs/HopVfs.java core/src/main/java/org/apache/hop/core/vfs/HopVfsNamespaces.java core/src/test/java/org/apache/hop/core/vfs/HopVfsMultiTenantBootstrapTest.java | tee ../candidate.diff
          changed=$(git diff --name-only | sort)
          echo "$changed"
          test "$(echo "$changed" | grep -v '^core/src/main/java/org/apache/hop/core/vfs/HopVfs.java$' | grep -v '^core/src/main/java/org/apache/hop/core/vfs/HopVfsNamespaces.java$' | grep -v '^core/src/test/java/org/apache/hop/core/vfs/HopVfsMultiTenantBootstrapTest.java$' | wc -l)" -eq 0
          grep -q 'if (variables != null && HopVfsNamespaces.isIsolateEverything())' core/src/main/java/org/apache/hop/core/vfs/HopVfs.java

      - name: Run focused core VFS regression tests
        working-directory: hop
        run: |
          ./mvnw -B -pl core -DskipITs -Dtest=HopVfsMultiTenantBootstrapTest,HopVfsNamespaceScopingTest,HopVfsSingleManagerTest,HopVfsTest test 2>&1 | tee ../core-vfs-tests.log

      - name: Compile affected modules
        working-directory: hop
        run: |
          ./mvnw -B -pl core,ui,rap,engine,plugins/misc/projects -am -DskipTests install 2>&1 | tee ../affected-build.log

      - name: Static cross-check production call sites
        run: |
          cd hop
          git grep -n 'setBootstrapVariables(' -- ':!**/src/test/**' | tee ../bootstrap-call-sites.log
          count=$(git grep -n 'setBootstrapVariables(' -- ':!**/src/test/**' | wc -l)
          test "$count" -eq 2
          git grep -n 'HopVfs.reset()' -- ':!**/src/test/**' | tee ../vfs-reset-call-sites.log || true
          git grep -n 'HopVfs.refresh(' -- ':!**/src/test/**' | tee ../vfs-refresh-call-sites.log || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfs-session-fix-round1
          path: |
            vfs-lineage.log
            candidate.diff
            core-vfs-tests.log
            affected-build.log
            bootstrap-call-sites.log
            vfs-reset-call-sites.log
            vfs-refresh-call-sites.log
          if-no-files-found: warn
