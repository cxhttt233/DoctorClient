name: Hop Web loading final 20260820

on:
  push:
    branches: [hop-web-loading-20260820]
    paths:
      - '.github/workflows/hop-web-loading-final-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-final-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Publish final run marker
        continue-on-error: true
        run: |
          printf 'status=running\nrun_id=%s\nrun_number=%s\nsource_sha=%s\ntime=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > loading-final-status-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loading-final-status-20260820.txt
          git commit -m "ci: final loading run ${GITHUB_RUN_NUMBER} started" || exit 0
          git pull --rebase origin hop-web-loading-20260820 || true
          git push origin HEAD:hop-web-loading-20260820

      - name: Checkout exact Aug 20 Hop baseline
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 362140499c9afbff3e6ae3afede89a1796eaf972
          test "$(git rev-parse HEAD)" = "362140499c9afbff3e6ae3afede89a1796eaf972"

      - name: Apply validated final fix then RAP loading patch
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop
          python3 verify_hotfix.py hop
          python3 apply_loading_splash.py hop
          grep -q 'hop-loading-splash' hop/rap/src/main/java/org/apache/hop/ui/hopgui/HopWeb.java
          grep -q 'display.asyncExec(() -> display.timerExec(250, this::hideLoadingSplash));' hop/rap/src/main/java/org/apache/hop/ui/hopgui/HopWebEntryPoint.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile exact final combination
        working-directory: hop
        run: ./mvnw -B -pl ui,plugins/misc/git,rap -am -DskipTests install

      - name: Verify final fix ABI is still present
        working-directory: hop
        run: |
          javap -classpath ui/target/hop-ui-2.20.0-SNAPSHOT.jar org.apache.hop.ui.hopgui.HopGui > /tmp/hopgui-api.txt
          grep -F 'public org.apache.hop.core.security.HopSecurityContext getSecurityContext();' /tmp/hopgui-api.txt
          grep -F 'public void setSecurityContext(org.apache.hop.core.security.HopSecurityContext);' /tmp/hopgui-api.txt
          javap -classpath ui/target/hop-ui-2.20.0-SNAPSHOT.jar org.apache.hop.ui.hopgui.file.shared.DrillDownGuiPlugin > /tmp/drill-api.txt
          grep -F 'public static void cleanupOnRunStart();' /tmp/drill-api.txt
          grep -F 'public static void cleanupOnRunStart(java.lang.String);' /tmp/drill-api.txt
          if strings ui/target/hop-ui-2.20.0-SNAPSHOT.jar | grep -q 'XmlSnapshotUndo'; then
            echo 'Unexpected XmlSnapshotUndo reference'
            exit 1
          fi

      - name: Stage final RAP-only artifact
        run: |
          mkdir -p final-artifacts
          cp hop/rap/target/hop-ui-rap-2.20.0-SNAPSHOT.jar final-artifacts/
          sha256sum final-artifacts/hop-ui-rap-2.20.0-SNAPSHOT.jar | tee final-artifacts/SHA256SUMS.txt
          cat > final-artifacts/BASELINE.txt <<'EOF'
          Apache Hop source baseline: 362140499c9afbff3e6ae3afede89a1796eaf972
          Loading layer: RAP-only (hop-ui-rap-2.20.0-SNAPSHOT.jar)
          Required already-installed final hotfix JARs:
          hop-ui-2.20.0-SNAPSHOT.jar fbd7a631a790473d1804ba90566593c4942ba8d681f1902bdcc37c07b3a7b729
          hop-misc-git-2.20.0-SNAPSHOT.jar ec08417e2ccab58db04696ef0c1116437e4b2b92abd7476692e8dec60e8607c0
          EOF

      - name: Build complete Hop Web image
        working-directory: hop
        run: |
          printf '\n!lib-p2/\n!lib-p2/**\n' >> .dockerignore
          docker build --progress=plain \
            -f docker/unified.Dockerfile \
            --target web \
            --build-arg HOP_BUILD_FROM_SOURCE=local \
            --build-arg BUILDER_TYPE=full \
            --build-arg SKIP_FAT_JAR=true \
            -t hop-web-loading-final-20260820 .

      - name: Start actual Hop Web container
        run: |
          docker run -d --name hop-web-loading-final-20260820 -p 18080:8080 \
            -e HOP_LOG_LEVEL=Basic hop-web-loading-final-20260820
          for i in $(seq 1 90); do
            if curl -sS --max-time 2 http://127.0.0.1:18080/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs hop-web-loading-final-20260820 || true
          exit 1

      - name: Measure splash disappearance continuously
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          test -n "$CHROME"
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900, deviceScaleFactor: 1 });
            const started = Date.now();
            await page.goto('http://127.0.0.1:18080/ui', { waitUntil: 'domcontentloaded', timeout: 30000 });
            const domContentLoadedMs = Date.now() - started;
            let lastVisibleMs = null;
            let firstHiddenMs = null;
            let sawVisible = false;
            let initialText = null;
            const samples = [];
            while (Date.now() - started < 60000) {
              const ms = Date.now() - started;
              const state = await page.evaluate(() => {
                const e = document.getElementById('hop-loading-splash');
                if (!e) return { exists:false };
                const cs = getComputedStyle(e);
                return { exists:true, display:cs.display, opacity:cs.opacity, visibility:cs.visibility, text:e.innerText };
              });
              const hidden = !state.exists || state.display === 'none' || state.visibility === 'hidden' || state.opacity === '0';
              samples.push({ms, hidden, state});
              if (!hidden) {
                sawVisible = true;
                lastVisibleMs = ms;
                if (initialText === null) initialText = state.text;
              } else if (sawVisible) {
                firstHiddenMs = ms;
                break;
              }
              await new Promise(r => setTimeout(r, 50));
            }
            const result = {domContentLoadedMs,lastVisibleMs,firstHiddenMs,resolutionMs:50,sawVisible,disappeared:firstHiddenMs!==null,initialText,sampleCount:samples.length};
            fs.writeFileSync('final-artifacts/disappearance-time.json', JSON.stringify(result, null, 2) + '\n');
            fs.writeFileSync('final-artifacts/disappearance-samples.json', JSON.stringify(samples, null, 2) + '\n');
            console.log(JSON.stringify(result));
            if (!sawVisible) throw new Error('Loading splash was never observed visible');
            if (firstHiddenMs === null) throw new Error('Loading splash did not disappear within 60 seconds');
            await page.screenshot({path:'final-artifacts/actual-after-disappear.png', fullPage:false});
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          cat final-artifacts/disappearance-time.json

      - name: Runtime fatal-signature scan
        run: |
          docker logs hop-web-loading-final-20260820 > final-artifacts/hop-web-runtime.log 2>&1 || true
          if grep -Eqi 'HTTP Status 500|NoSuchMethodError|NoSuchFieldError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Invalid thread access|InvalidThreadAccess|invalid.*UISession|disposed UISession|Widget is disposed|UnsupportedClassVersionError' final-artifacts/hop-web-runtime.log; then
            echo 'Fatal signature found:'
            grep -Ein 'HTTP Status 500|NoSuchMethodError|NoSuchFieldError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Invalid thread access|InvalidThreadAccess|invalid.*UISession|disposed UISession|Widget is disposed|UnsupportedClassVersionError' final-artifacts/hop-web-runtime.log || true
            exit 1
          fi

      - name: Upload final RAP loading artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-web-loading-final-20260820
          path: final-artifacts/*
          if-no-files-found: error

      - name: Cleanup container
        if: always()
        run: docker rm -f hop-web-loading-final-20260820 >/dev/null 2>&1 || true

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'status=%s\nrun_id=%s\nrun_number=%s\nsource_sha=%s\ntime=%s\n' "$RESULT" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > loading-final-status-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loading-final-status-20260820.txt
          git commit -m "ci: final loading run ${GITHUB_RUN_NUMBER} ${RESULT}" || exit 0
          git pull --rebase origin hop-web-loading-20260820 || true
          git push origin HEAD:hop-web-loading-20260820
