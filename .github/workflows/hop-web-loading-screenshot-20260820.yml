name: Hop Web loading actual screenshot 20260820

on:
  push:
    branches: [hop-web-loading-20260820]
    paths:
      - '.github/workflows/hop-web-loading-screenshot-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Publish screenshot run marker
        continue-on-error: true
        run: |
          printf 'status=running\nrun_id=%s\nrun_number=%s\nsource_sha=%s\ntime=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > screenshot-status-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add screenshot-status-20260820.txt
          git commit -m "ci: screenshot run ${GITHUB_RUN_NUMBER} started" || exit 0
          git pull --rebase origin hop-web-loading-20260820 || true
          git push origin HEAD:hop-web-loading-20260820

      - name: Checkout exact Aug 20 Hop baseline
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 362140499c9afbff3e6ae3afede89a1796eaf972
          test "$(git rev-parse HEAD)" = "362140499c9afbff3e6ae3afede89a1796eaf972"

      - name: Apply validated hotfix and RAP loading patch
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop
          python3 verify_hotfix.py hop
          python3 apply_loading_splash.py hop
          grep -q 'hop-loading-splash' hop/rap/src/main/java/org/apache/hop/ui/hopgui/HopWeb.java
          grep -q 'display.asyncExec(() -> display.timerExec(250, this::hideLoadingSplash));' hop/rap/src/main/java/org/apache/hop/ui/hopgui/HopWebEntryPoint.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile exact combination
        working-directory: hop
        run: ./mvnw -B -pl ui,plugins/misc/git,rap -am -DskipTests install

      - name: Build complete Hop Web image
        working-directory: hop
        run: |
          printf '\n!lib-p2/\n!lib-p2/**\n' >> .dockerignore
          docker build --progress=plain \
            -f docker/unified.Dockerfile \
            --target web \
            --build-arg HOP_BUILD_FROM_SOURCE=local \
            --build-arg BUILDER_TYPE=full \
            --build-arg SKIP_FAT_JAR=true \
            -t hop-web-loading-screenshot-20260820 .

      - name: Start actual Hop Web container
        run: |
          docker run -d --name hop-web-loading-screenshot-20260820 -p 18080:8080 \
            -e HOP_LOG_LEVEL=Basic hop-web-loading-screenshot-20260820
          for i in $(seq 1 90); do
            if curl -sS --max-time 2 http://127.0.0.1:18080/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs hop-web-loading-screenshot-20260820 || true
          exit 1

      - name: Capture real browser screenshots and disappearance time
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p screenshot-artifacts
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          test -n "$CHROME"
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900, deviceScaleFactor: 1 });
            const started = Date.now();
            await page.goto('http://127.0.0.1:18080/ui', { waitUntil: 'domcontentloaded', timeout: 30000 });

            async function getState() {
              return await page.evaluate(() => {
                const e = document.getElementById('hop-loading-splash');
                if (!e) return { exists:false };
                const cs = getComputedStyle(e);
                return {
                  exists:true,
                  display:cs.display,
                  opacity:cs.opacity,
                  visibility:cs.visibility,
                  pointerEvents:cs.pointerEvents,
                  text:e.innerText
                };
              });
            }
            async function snap(name) {
              const state = await getState();
              fs.appendFileSync('screenshot-artifacts/state.txt', `${Date.now()-started}ms ${name} ${JSON.stringify(state)}\n`);
              await page.screenshot({ path:`screenshot-artifacts/${name}.png`, fullPage:false });
            }

            await snap('actual-loading-0ms');
            await new Promise(r => setTimeout(r, 400));
            await snap('actual-loading-400ms');
            await new Promise(r => setTimeout(r, 800));
            await snap('actual-loading-1200ms');
            await new Promise(r => setTimeout(r, 3000));
            await snap('actual-loading-4200ms');

            let lastVisibleMs = null;
            let firstHiddenMs = null;
            let firstHiddenState = null;
            const samples = [];
            while (Date.now() - started < 90000) {
              const nowMs = Date.now() - started;
              const state = await getState();
              const hidden = !state.exists || state.display === 'none' || state.visibility === 'hidden' || state.opacity === '0';
              samples.push({ ms: nowMs, hidden, state });
              if (hidden) {
                firstHiddenMs = nowMs;
                firstHiddenState = state;
                break;
              }
              lastVisibleMs = nowMs;
              await new Promise(r => setTimeout(r, 100));
            }

            const result = {
              navigationStartedEpochMs: started,
              lastVisibleMs,
              firstHiddenMs,
              resolutionMs: 100,
              disappeared: firstHiddenMs !== null,
              firstHiddenState,
              sampleCount: samples.length
            };
            fs.writeFileSync('screenshot-artifacts/disappearance-time.json', JSON.stringify(result, null, 2) + '\n');
            fs.writeFileSync('screenshot-artifacts/disappearance-samples.json', JSON.stringify(samples, null, 2) + '\n');
            if (firstHiddenMs !== null) {
              await page.screenshot({ path:'screenshot-artifacts/actual-after-disappear.png', fullPage:false });
            } else {
              await page.screenshot({ path:'screenshot-artifacts/actual-still-visible-90s.png', fullPage:false });
            }
            console.log(JSON.stringify(result));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          cat screenshot-artifacts/state.txt
          cat screenshot-artifacts/disappearance-time.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('screenshot-artifacts/disappearance-time.json').read_text())
          if not result.get('disappeared'):
              raise SystemExit('Loading splash did not disappear within 90 seconds')
          print(f"Loading splash first hidden at {result['firstHiddenMs']} ms; last visible at {result['lastVisibleMs']} ms")
          PY

      - name: Save runtime logs
        if: always()
        run: |
          mkdir -p screenshot-artifacts
          docker logs hop-web-loading-screenshot-20260820 > screenshot-artifacts/hop-web-runtime.log 2>&1 || true
          docker rm -f hop-web-loading-screenshot-20260820 >/dev/null 2>&1 || true

      - name: Upload actual screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-web-loading-actual-screenshots-20260820
          path: screenshot-artifacts/*
          if-no-files-found: error

      - name: Publish final screenshot status
        if: always()
        continue-on-error: true
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'status=%s\nrun_id=%s\nrun_number=%s\nsource_sha=%s\ntime=%s\n' "$RESULT" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > screenshot-status-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add screenshot-status-20260820.txt
          git commit -m "ci: screenshot run ${GITHUB_RUN_NUMBER} ${RESULT}" || exit 0
          git pull --rebase origin hop-web-loading-20260820 || true
          git push origin HEAD:hop-web-loading-20260820
