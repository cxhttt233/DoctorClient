name: Hop Web session hotfix

on:
  push:
    branches: [hop-web-session-hotfix-v1]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Apache Hop
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 2a2ba3f78c5d7b315c956967ac859fa430802058
      - name: Apply hotfix
        run: python3 apply_hotfix.py hop
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run targeted tests
        working-directory: hop
        run: ./mvnw -B -pl ui,plugins/misc/git -am -DskipITs test
      - name: Package hotfix jars
        working-directory: hop
        run: ./mvnw -B -pl ui,plugins/misc/git -am -DskipTests package
      - name: Collect jars
        run: |
          mkdir -p artifacts
          cp hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar artifacts/
          cp hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: hop-web-session-hotfix-v1
          path: artifacts/*.jar
          if-no-files-found: error
