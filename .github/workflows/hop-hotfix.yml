name: Hop Web session hotfix

on:
  push:
    branches: [hop-web-session-hotfix-v1]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Apache Hop
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 2a2ba3f78c5d7b315c956967ac859fa430802058

      - name: Apply hotfix
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop

      - name: Verify hotfix invariants
        run: python3 verify_hotfix.py hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and install hotfix modules
        id: build
        continue-on-error: true
        working-directory: hop
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -pl ui,plugins/misc/git -am -DskipTests install 2>&1 | tee ../maven-build.log

      - name: Run UI and Git module tests
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: hop
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -pl ui,plugins/misc/git -DskipITs test 2>&1 | tee ../maven-test.log

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-hotfix-diagnostics
          path: |
            maven-build.log
            maven-test.log
          if-no-files-found: warn

      - name: Collect jars
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        run: |
          mkdir -p artifacts
          cp hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar artifacts/
          cp hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar artifacts/
          sha256sum artifacts/*.jar > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload jars
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hop-web-session-hotfix-v1
          path: artifacts/*
          if-no-files-found: error

      - name: Report result to PR
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Hop hotfix CI report'
            echo
            echo "- Build: ${BUILD_OUTCOME:-not-run}"
            echo "- UI/Git tests: ${TEST_OUTCOME:-not-run}"
            echo "- Run: ${RUN_URL}"
            for f in maven-build.log maven-test.log; do
              if [ -f "$f" ]; then
                echo
                echo "<details><summary>${f} tail</summary>"
                echo
                echo '```text'
                tail -n 120 "$f"
                echo '```'
                echo '</details>'
              fi
            done
          } > ci-report.md
          gh pr comment "$PR_URL" --body-file ci-report.md

      - name: Fail if validation failed
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          test "$BUILD_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
