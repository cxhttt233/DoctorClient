name: Hop Web session hotfix

on:
  push:
    branches: [hop-web-session-hotfix-v1]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Apache Hop
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 2a2ba3f78c5d7b315c956967ac859fa430802058

      - name: Apply hotfix
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop

      - name: Verify hotfix invariants
        run: python3 verify_hotfix.py hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run targeted tests
        id: test
        continue-on-error: true
        working-directory: hop
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -pl ui,plugins/misc/git -am -DskipITs test 2>&1 | tee ../maven-test.log

      - name: Upload Maven test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-hotfix-test-diagnostics
          path: maven-test.log
          if-no-files-found: warn

      - name: Package hotfix jars
        id: package
        if: steps.test.outcome == 'success'
        continue-on-error: true
        working-directory: hop
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -pl ui,plugins/misc/git -am -DskipTests package 2>&1 | tee ../maven-package.log

      - name: Upload Maven package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-hotfix-package-diagnostics
          path: maven-package.log
          if-no-files-found: warn

      - name: Collect jars
        if: steps.package.outcome == 'success'
        run: |
          mkdir -p artifacts
          cp hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar artifacts/
          cp hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar artifacts/
          sha256sum artifacts/*.jar > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload jars
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hop-web-session-hotfix-v1
          path: artifacts/*
          if-no-files-found: error

      - name: Report result to PR
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Hop hotfix CI report'
            echo
            echo "- Test: ${TEST_OUTCOME:-not-run}"
            echo "- Package: ${PACKAGE_OUTCOME:-not-run}"
            echo "- Run: ${RUN_URL}"
            if [ -f maven-test.log ]; then
              echo
              echo '<details><summary>Maven test tail</summary>'
              echo
              echo '```text'
              tail -n 120 maven-test.log
              echo '```'
              echo '</details>'
            fi
            if [ -f maven-package.log ]; then
              echo
              echo '<details><summary>Maven package tail</summary>'
              echo
              echo '```text'
              tail -n 80 maven-package.log
              echo '```'
              echo '</details>'
            fi
          } > ci-report.md
          gh pr comment "$PR_URL" --body-file ci-report.md

      - name: Fail if validation failed
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          test "$TEST_OUTCOME" = "success"
          test "$PACKAGE_OUTCOME" = "success"
