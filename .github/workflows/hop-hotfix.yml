name: Hop Web session hotfix

on:
  push:
    branches: [hop-web-session-hotfix-v1]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Apache Hop
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 2a2ba3f78c5d7b315c956967ac859fa430802058

      - name: Apply and verify hotfix
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop
          python3 verify_hotfix.py hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile hotfix modules
        id: build
        continue-on-error: true
        working-directory: hop
        run: |
          set -o pipefail
          ./mvnw -B -pl ui,plugins/misc/git -am -DskipTests install 2>&1 | tee ../maven-build.log

      - name: Run UI and Git tests
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: hop
        run: |
          set -o pipefail
          ./mvnw -B -pl ui,plugins/misc/git -DskipITs test 2>&1 | tee ../maven-test.log

      - name: Runtime dual-session smoke
        id: smoke
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: true
        working-directory: hop
        run: |
          set -Eeuo pipefail
          docker build --progress=plain -f docker/unified.Dockerfile --target web \
            --build-arg HOP_BUILD_FROM_SOURCE=local \
            --build-arg BUILDER_TYPE=full \
            --build-arg SKIP_FAT_JAR=true \
            -t hop-web-hotfix-smoke . 2>&1 | tee ../docker-build.log
          docker run -d --name hop-web-hotfix-smoke -p 18080:8080 -e HOP_LOG_LEVEL=Basic hop-web-hotfix-smoke
          cleanup() {
            docker logs hop-web-hotfix-smoke > ../hop-web-smoke.log 2>&1 || true
            docker rm -f hop-web-hotfix-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl -fsSL --max-time 10 http://127.0.0.1:18080/ui -o /tmp/hop-ready.html; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          rm -f ../session-a.cookies ../session-b.cookies
          curl -fsSL --max-time 20 -c ../session-a.cookies -b ../session-a.cookies http://127.0.0.1:18080/ui -o ../session-a.html
          curl -fsSL --max-time 20 -c ../session-b.cookies -b ../session-b.cookies http://127.0.0.1:18080/ui -o ../session-b.html
          sid_a=$(awk '$6 == "JSESSIONID" {print $7}' ../session-a.cookies | tail -1)
          sid_b=$(awk '$6 == "JSESSIONID" {print $7}' ../session-b.cookies | tail -1)
          echo "Session A JSESSIONID: ${sid_a:-missing}"
          echo "Session B JSESSIONID: ${sid_b:-missing}"
          test -n "$sid_a" && test -n "$sid_b" && test "$sid_a" != "$sid_b"
          for i in $(seq 1 12); do
            curl -fsSL --max-time 20 -b ../session-a.cookies http://127.0.0.1:18080/ui -o /tmp/session-a-${i}.html &
            curl -fsSL --max-time 20 -b ../session-b.cookies http://127.0.0.1:18080/ui -o /tmp/session-b-${i}.html &
          done
          wait
          sleep 3
          docker logs hop-web-hotfix-smoke > ../hop-web-smoke.log 2>&1
          if grep -Eiq 'Invalid thread access|InvalidThreadAccess|UISession.{0,80}(invalid|disposed)|Widget is disposed|SWTException.{0,80}thread|ERROR.{0,120}(UISession|thread access)' ../hop-web-smoke.log; then
            grep -Ein 'Invalid thread access|InvalidThreadAccess|UISession.{0,80}(invalid|disposed)|Widget is disposed|SWTException.{0,80}thread|ERROR.{0,120}(UISession|thread access)' ../hop-web-smoke.log | tail -50 || true
            exit 1
          fi
          echo 'Hop Web runtime smoke test passed with two distinct concurrent sessions.'

      - name: Collect jars
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success' && steps.smoke.outcome == 'success'
        run: |
          mkdir -p artifacts
          cp hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar artifacts/
          cp hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar artifacts/
          sha256sum artifacts/*.jar > artifacts/SHA256SUMS.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-hotfix-diagnostics
          path: |
            maven-build.log
            maven-test.log
            docker-build.log
            hop-web-smoke.log
            session-a.cookies
            session-b.cookies
            session-a.html
            session-b.html
          if-no-files-found: warn

      - name: Upload jars
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hop-web-session-hotfix-v1
          path: artifacts/*
          if-no-files-found: error

      - name: Report result to PR harness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Hop hotfix CI report'
            echo
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Build: ${BUILD_OUTCOME:-not-run}"
            echo "- UI/Git tests: ${TEST_OUTCOME:-not-run}"
            echo "- Runtime dual-session smoke: ${SMOKE_OUTCOME:-not-run}"
            echo "- Run: ${RUN_URL}"
            for f in maven-build.log maven-test.log docker-build.log hop-web-smoke.log; do
              if [ -f "$f" ]; then
                echo
                echo "<details><summary>${f} tail</summary>"
                echo
                echo '```text'
                tail -n 100 "$f"
                echo '```'
                echo '</details>'
              fi
            done
          } > ci-report.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file ci-report.md

      - name: Fail if validation failed
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$BUILD_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$SMOKE_OUTCOME" = success
