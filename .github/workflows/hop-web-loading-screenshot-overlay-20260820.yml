name: Hop Web loading actual screenshot overlay 20260820

on:
  push:
    branches: [hop-web-loading-20260820]
    paths:
      - '.github/workflows/hop-web-loading-screenshot-overlay-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Publish overlay screenshot marker
        continue-on-error: true
        run: |
          printf 'status=running\nrun_id=%s\nrun_number=%s\nsource_sha=%s\ntime=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > screenshot-overlay-status-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add screenshot-overlay-status-20260820.txt
          git commit -m "ci: overlay screenshot run ${GITHUB_RUN_NUMBER} started" || exit 0
          git pull --rebase origin hop-web-loading-20260820 || true
          git push origin HEAD:hop-web-loading-20260820

      - name: Checkout exact Aug 20 Hop baseline
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout 362140499c9afbff3e6ae3afede89a1796eaf972

      - name: Apply final hotfix plus RAP loading
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop
          python3 verify_hotfix.py hop
          python3 apply_loading_splash.py hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build only replacement jars
        working-directory: hop
        run: ./mvnw -B -pl ui,plugins/misc/git,rap -am -DskipTests install

      - name: Verify final hotfix jar generation
        run: |
          sha256sum hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar
          sha256sum hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar
          sha256sum hop/rap/target/hop-ui-rap-2.20.0-SNAPSHOT.jar
          test "$(sha256sum hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar | awk '{print $1}')" = "fbd7a631a790473d1804ba90566593c4942ba8d681f1902bdcc37c07b3a7b729"
          test "$(sha256sum hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar | awk '{print $1}')" = "ec08417e2ccab58db04696ef0c1116437e4b2b92abd7476692e8dec60e8607c0"
          test "$(sha256sum hop/rap/target/hop-ui-rap-2.20.0-SNAPSHOT.jar | awk '{print $1}')" = "5172383591f228812387de71282ac3487dddd1edc1ab10cbed7f38ffc87e7461"

      - name: Build tiny overlay on official image
        run: |
          mkdir overlay
          cp hop/ui/target/hop-ui-2.20.0-SNAPSHOT.jar overlay/
          cp hop/plugins/misc/git/target/hop-misc-git-2.20.0-SNAPSHOT.jar overlay/
          cp hop/rap/target/hop-ui-rap-2.20.0-SNAPSHOT.jar overlay/
          cat > overlay/Dockerfile <<'EOF'
          FROM apache/hop-web:2.20.0-SNAPSHOT-20260820
          USER root
          COPY hop-ui-2.20.0-SNAPSHOT.jar /usr/local/tomcat/webapps/ROOT/WEB-INF/lib/hop-ui-2.20.0-SNAPSHOT.jar
          COPY hop-ui-rap-2.20.0-SNAPSHOT.jar /usr/local/tomcat/webapps/ROOT/WEB-INF/lib/hop-ui-rap-2.20.0-SNAPSHOT.jar
          COPY hop-misc-git-2.20.0-SNAPSHOT.jar /usr/local/tomcat/plugins-disabled/git/hop-misc-git-2.20.0-SNAPSHOT.jar
          RUN chown 501:501 /usr/local/tomcat/webapps/ROOT/WEB-INF/lib/hop-ui-2.20.0-SNAPSHOT.jar /usr/local/tomcat/webapps/ROOT/WEB-INF/lib/hop-ui-rap-2.20.0-SNAPSHOT.jar /usr/local/tomcat/plugins-disabled/git/hop-misc-git-2.20.0-SNAPSHOT.jar
          USER 501
          EOF
          docker build -t hop-web-loading-overlay-20260820 overlay

      - name: Start actual overlay container
        run: |
          docker run -d --name hop-web-loading-overlay-20260820 -p 18080:8080 \
            -e HOP_LOG_LEVEL=Basic hop-web-loading-overlay-20260820
          for i in $(seq 1 90); do
            if curl -sS --max-time 2 http://127.0.0.1:18080/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs hop-web-loading-overlay-20260820 || true
          exit 1

      - name: Capture actual loading sequence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p overlay-screenshots
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          test -n "$CHROME"
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page = await browser.newPage();
            await page.setViewport({width:1440,height:900,deviceScaleFactor:1});
            const started=Date.now();
            await page.goto('http://127.0.0.1:18080/ui',{waitUntil:'domcontentloaded',timeout:30000});
            async function snap(name){
              const state=await page.evaluate(()=>{const e=document.getElementById('hop-loading-splash');if(!e)return{exists:false};const c=getComputedStyle(e);return{exists:true,display:c.display,opacity:c.opacity,text:e.innerText};});
              fs.appendFileSync('overlay-screenshots/state.txt',`${Date.now()-started}ms ${name} ${JSON.stringify(state)}\n`);
              await page.screenshot({path:`overlay-screenshots/${name}.png`});
            }
            await snap('actual-overlay-loading-0ms');
            await new Promise(r=>setTimeout(r,400)); await snap('actual-overlay-loading-400ms');
            await new Promise(r=>setTimeout(r,800)); await snap('actual-overlay-loading-1200ms');
            await new Promise(r=>setTimeout(r,3000)); await snap('actual-overlay-loading-4200ms');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          cat overlay-screenshots/state.txt

      - name: Save logs and remove container
        if: always()
        run: |
          mkdir -p overlay-screenshots
          docker logs hop-web-loading-overlay-20260820 > overlay-screenshots/hop-web-runtime.log 2>&1 || true
          docker rm -f hop-web-loading-overlay-20260820 >/dev/null 2>&1 || true

      - name: Upload actual overlay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-web-loading-actual-overlay-screenshots-20260820
          path: overlay-screenshots/*
          if-no-files-found: error

      - name: Publish final overlay screenshot status
        if: always()
        continue-on-error: true
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'status=%s\nrun_id=%s\nrun_number=%s\nsource_sha=%s\ntime=%s\n' "$RESULT" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > screenshot-overlay-status-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add screenshot-overlay-status-20260820.txt
          git commit -m "ci: overlay screenshot run ${GITHUB_RUN_NUMBER} ${RESULT}" || exit 0
          git pull --rebase origin hop-web-loading-20260820 || true
          git push origin HEAD:hop-web-loading-20260820
