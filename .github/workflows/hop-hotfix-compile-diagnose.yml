name: Hop Web hotfix 20260820 compile diagnose

on:
  push:
    branches: [hop-web-session-hotfix-20260820]
    paths:
      - '.github/workflows/hop-hotfix-compile-diagnose.yml'
      - 'apply_hotfix.py'
      - 'apply_hotfix_pre.py'
      - 'apply_hotfix_phase2.py'
      - 'verify_hotfix.py'
      - '.diag-trigger-20260820'

permissions:
  contents: write

jobs:
  diagnose-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Apache Hop image baseline
        run: |
          git clone --filter=blob:none https://github.com/apache/hop.git hop
          cd hop
          git checkout fe9619b0ae7cec95444cca0516bd8d6aada6cda0

      - name: Apply hotfix
        run: |
          python3 apply_hotfix_pre.py hop
          python3 apply_hotfix.py hop
          python3 apply_hotfix_phase2.py hop
          python3 verify_hotfix.py hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and capture diagnostic
        id: compile
        shell: bash
        run: |
          set +e
          (cd hop && ./mvnw -B -pl ui,plugins/misc/git -am -DskipTests install) 2>&1 | tee /tmp/hop-compile.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "compile_exit=$rc"
            echo "baseline=fe9619b0ae7cec95444cca0516bd8d6aada6cda0"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "==== compiler errors ===="
            grep -E '^\[ERROR\]|COMPILATION ERROR|cannot find symbol|incompatible types|method .* cannot be applied|constructor .* cannot be applied|package .* does not exist' /tmp/hop-compile.log | tail -n 220 || true
            echo "==== log tail ===="
            tail -n 260 /tmp/hop-compile.log
          } > compile-error-20260820.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compile-error-20260820.txt
          git commit -m "ci: capture 20260820 compile diagnostic [skip ci]" || true
          git push origin HEAD:hop-web-session-hotfix-20260820
          exit "$rc"
